services:
  - type: web
    name: mayleki-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: "5000"
      # ─────────────────────────────────────────────────────────────────────
      # REQUIRED: Set this manually in the Render Dashboard → Environment tab
      # Value format: mongodb+srv://<user>:<password>@<cluster>.mongodb.net/<db>?retryWrites=true&w=majority
      # ─────────────────────────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      # ─────────────────────────────────────────────────────────────────────
      # REQUIRED: Set these manually in Render Dashboard
      # ─────────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
